name: Agent Governance Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  governance-gate:
    name: Statistical Trajectory & FinOps Verification
    runs-on: macos-14  # Apple Silicon runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Core Governance & Statistical Test Suite
        run: |
          uv run pytest -v tests/ --junitxml=junit.xml

      - name: Execute Dispute Resolution Scenario Benchmark
        run: |
          uv run python benchmarks/generate_executive_report.py

      - name: Verify Aegis CLI & Runtime Demo
        run: |
          uv run aegis report -o /tmp/aegis_report.md
          uv run aegis profile-mcp --turns 5 --payload-bytes 1024
          uv run aegis route "Extract customer ID and order number from JSON schema"
          uv run python examples/live_governed_agent.py
