[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-agent-governance"
version = "0.1.0"
description = "Enterprise-grade Agentic Statistical Evaluation, Protocol Profiling, and FinOps Governance Control Plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Promptly Broken Architect Team", email = "architect@promptlybroken.ai" }
]
keywords = [
    "agents",
    "evaluation",
    "finops",
    "governance",
    "sprt",
    "tdi",
    "ecrt",
    "mcp",
    "apple-silicon",
    "mlx",
    "ollama"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[project.entry-points.pytest11]
aegis = "aegis.pytest_plugin.decorator"

[project.urls]
Homepage = "https://github.com/promptly-broken/aegis-agent-governance"
Repository = "https://github.com/promptly-broken/aegis-agent-governance"
Documentation = "https://github.com/promptly-broken/aegis-agent-governance/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
